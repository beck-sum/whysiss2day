      <h2 class="h2-subtitle"></h2>
      <div class="container-select">
        <div class="select-trigger" data-value="notselectioned">Selecione um dia da semana <span class="material-symbols-outlined icon">
arrow_drop_down
</span></div>
        <ul class="container-options">

arrow_drop_up

          <li class="option-item" data-value="tuesday">Terça</li>
          <li class="option-item" data-value="wednesday">Quarta</li>
          <li class="option-item" data-value="thursday">Quinta</li>
          <li class="option-item" data-value="friday">Sexta</li>
